name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies from Tsinghua mirror
        run: >-
          python -m pip install
          -i https://pypi.tuna.tsinghua.edu.cn/simple
          -r backend/requirements-dev.txt
      - name: Run regression tests
        run: >-
          python -m pytest -q -p no:cacheprovider -m "not e2e" --basetemp=.pytest-tmp
          --cov=backend/app --cov-branch --cov-report=term
          --cov-fail-under=85
      - name: Compile Python sources
        run: python -m compileall -q backend/app desktop

  browser-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies from Tsinghua mirror
        run: >-
          python -m pip install
          -i https://pypi.tuna.tsinghua.edu.cn/simple
          -r backend/requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Run real-browser classroom simulation
        env:
          RUN_BROWSER_E2E: "1"
        run: python -m pytest -q -p no:cacheprovider -m e2e --basetemp=.pytest-e2e-tmp

  macos-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies from Tsinghua mirror
        run: >-
          python -m pip install
          -i https://pypi.tuna.tsinghua.edu.cn/simple
          -r backend/requirements-dev.txt
      - name: Run macOS regression tests
        run: >-
          python -m pytest -q -p no:cacheprovider -m "not e2e" --basetemp=.pytest-tmp
      - name: Compile Python sources
        run: python -m compileall -q backend/app desktop
